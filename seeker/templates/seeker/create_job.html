<!DOCTYPE html>
<html>
<head>
    <title>Create Job Vacancy</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 30px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        h2 {
            text-align: center;
            color: #5b4baf;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #5b4baf;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        a {
            color: #5b4baf;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Create Job Vacancy</h2>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="title"
               placeholder="Job Title" required>

        <input type="text" name="company"
               placeholder="Company Name" required>

        <input type="text" name="location"
               placeholder="Job Location" required>

        <input type="text" name="skills"
               placeholder="Required Skills" required>

        <textarea name="description"
                  placeholder="Job Description"
                  required></textarea>

        <button type="submit">Post Job</button>
    </form>

    <p><a href="/employer-dashboard/">← Back to Dashboard</a></p>

</div>

</body>
</html>
