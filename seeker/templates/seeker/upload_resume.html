<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Resume - JobPortal</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4568dc, #b06ab3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(0,0,0,0.2);
        }

        h1 {
            color: #4236a5;
        }

        p {
            color: #777;
            line-height: 1.6;
        }

        input[type="file"] {
            width: 100%;
            padding: 15px;
            border: 2px dashed #8e44ad;
            border-radius: 10px;
            margin: 20px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #4568dc, #8e44ad);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #6755d8;
            text-decoration: none;
        }

        .message {
            color: green;
            margin: 15px 0;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Upload Your Resume</h1>

        <p>
            Upload your latest resume in PDF format
            to explore suitable job opportunities.
        </p>

        {% if messages %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <input type="file" name="resume"
                   accept=".pdf,application/pdf" required>

            <button type="submit">Upload Resume</button>
        </form>

        <a href="/dashboard/" class="back">
            ← Back to Dashboard
        </a>

    </div>

</body>
</html>
