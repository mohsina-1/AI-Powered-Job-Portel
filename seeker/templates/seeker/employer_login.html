<!DOCTYPE html>
<html>
<head>
    <title>Employer Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #333;
        }

        h2 {
            text-align: center;
            color: #5b4baf;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #5b4baf;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        a {
            color: #5b4baf;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Employer Login</h2>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username"
               placeholder="Username" required>

        <input type="password" name="password"
               placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

    <p>Don't have an account?
        <a href="/employer-register/">Register here</a>
    </p>

</div>

</body>
</html>
